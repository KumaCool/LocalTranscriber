[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "local-transcriber"
dynamic = ["version"]
description = "Offline CPU speech transcription with anonymous speaker diarization"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Shunnketu Kuma" },
]
keywords = [
  "speech-to-text",
  "transcription",
  "speaker-diarization",
  "funasr",
  "sensevoice",
  "offline",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
  "funasr==1.3.30",
  "modelscope==1.39.0",
  "psutil==7.2.2",
  "torch==2.10.0",
  "torchaudio==2.10.0",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchaudio = { index = "pytorch-cpu" }

[project.scripts]
local-transcriber = "local_transcriber.cli:main"

[project.urls]
Homepage = "https://github.com/KumaCool/LocalTranscriber"
Repository = "https://github.com/KumaCool/LocalTranscriber.git"
Issues = "https://github.com/KumaCool/LocalTranscriber/issues"
Documentation = "https://github.com/KumaCool/LocalTranscriber#readme"

[dependency-groups]
dev = [
  "pytest==9.0.2",
  "ruff==0.12.7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/local_transcriber"]

[tool.hatch.build.targets.sdist]
include = [
  "/CHANGELOG.md",
  "/CONTRIBUTING.md",
  "/LICENSE",
  "/README.md",
  "/SECURITY.md",
  "/src",
]

[tool.hatch.build.targets.wheel.force-include]
"CHANGELOG.md" = "CHANGELOG.md"
"LICENSE" = "LICENSE"
"README.md" = "README.md"

[tool.hatch.version]
path = "src/local_transcriber/__init__.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
